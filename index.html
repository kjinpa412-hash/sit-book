<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JD Construction">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<title>Jamyang Dzongsar Construction</title>
<meta name="theme-color" content="#2B1D14">
<style>
/* Layout: one phone-width column; dark brown header and tab bar frame a warm sand work area. */
:root {
  --bg: #F4ECDF;
  --surface: #FFFAF2;
  --surface-2: #EDE1CE;
  --line: #E0CFB6;
  --brown-900: #2B1D14;
  --brown-800: #3B2819;
  --brown-700: #5A3E2B;
  --brown-500: #866649;
  --brown-300: #B39A80;
  --yellow: #F5B800;
  --yellow-deep: #D99A00;
  --yellow-soft: #FFF0C4;
  --on-dark: #FFF4DF;
  --good: #3D8B4C; --good-soft: #DFF0E0;
  --warn: #C9771F; --warn-soft: #FBE6CF;
  --bad: #B93B28;  --bad-soft: #F7DAD3;

  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;

  --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
  --ease: cubic-bezier(.22,.8,.24,1);
  --shadow: 0 1px 0 rgba(59,40,25,.04), 0 6px 18px -8px rgba(59,40,25,.22);
  --tabbar-h: 68px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--brown-900);
  font: 400 15px/1.45 var(--body);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

.shell { max-width: 560px; margin: 0 auto; min-height: 100vh; position: relative; }

/* ---------- Header ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(160deg, var(--brown-800), var(--brown-900));
  color: var(--on-dark);
  padding-top: env(safe-area-inset-top, 0px);
}
.top-inner {
  display: flex; align-items: center; gap: 12px;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));
}
.brand-mark {
  width: 42px; height: 42px; border-radius: 50%; flex: none; object-fit: cover;
  border: 2.5px solid var(--yellow); background: var(--yellow); color: var(--brown-900);
  display: grid; place-items: center;
  font: 800 20px/1 var(--display);
}
.top-text { flex: 1; min-width: 0; }
.top-title { font: 700 21px/1.05 var(--display); letter-spacing: .3px; text-wrap: balance; }
.top-sub { font-size: 12.5px; color: var(--brown-300); margin-top: 3px; display: flex; flex-wrap: wrap; column-gap: 4px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: rgba(255,244,223,.08); color: var(--on-dark);
  transition: background .2s var(--ease), transform .15s var(--ease);
}
.icon-btn:active { transform: scale(.92); background: rgba(255,244,223,.16); }
/* hazard tape: the site's own warning stripe */
.tape {
  height: 6px;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 10px, var(--brown-900) 10px 20px);
}

/* ---------- Main + views ---------- */
main {
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.view { display: grid; gap: 18px; }
.view.enter { animation: viewIn .42s var(--ease) both; }
.view.enter-back { animation: viewBack .42s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes viewBack { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
.view.enter > * { animation: rise .5s var(--ease) both; }
.view.enter > *:nth-child(2) { animation-delay: .04s; }
.view.enter > *:nth-child(3) { animation-delay: .08s; }
.view.enter > *:nth-child(4) { animation-delay: .12s; }
.view.enter > *:nth-child(n+5) { animation-delay: .16s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

h2.sec {
  margin: 0; font: 700 13px/1 var(--body); letter-spacing: 1.2px; text-transform: uppercase; color: var(--brown-500);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.page-title { margin: 0; font: 800 30px/1 var(--display); letter-spacing: .2px; text-wrap: balance; }
.muted { color: var(--brown-500); }
.small { font-size: 13px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow);
}
.pad { padding: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* ---------- Stat tiles ---------- */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { padding: 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.stat.hero { background: linear-gradient(150deg, var(--brown-700), var(--brown-900)); color: var(--on-dark); border-color: transparent; }
.stat.hero .stat-label { color: var(--brown-300); }
.stat.hero .stat-val { color: var(--yellow); }
.stat-label { font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--brown-500); }
.stat-val { font: 700 28px/1.1 var(--display); margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat-note { font-size: 12.5px; color: var(--brown-500); margin-top: 2px; }
.stat.hero .stat-note { color: var(--brown-300); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 14px;
  font-weight: 700; font-size: 15px;
  transition: transform .15s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease);
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--yellow); color: var(--brown-900); box-shadow: 0 6px 16px -8px rgba(217,154,0,.8); }
.btn-primary:active { background: var(--yellow-deep); }
.btn-dark { background: var(--brown-800); color: var(--on-dark); }
.btn-soft { background: var(--surface-2); color: var(--brown-800); }
.btn-ghost { color: var(--brown-700); min-height: 40px; padding: 0 10px; }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.btn-block { width: 100%; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 11px; }

/* ---------- Quick actions ---------- */
.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.action {
  display: flex; align-items: center; gap: 12px; padding: 14px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  transition: transform .18s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
}
.action:active { transform: scale(.97); border-color: var(--yellow); }
.action-ic {
  width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: var(--yellow-soft); color: var(--brown-800);
}
.action b { display: block; font-size: 14.5px; }
.action span { display: block; font-size: 12.5px; color: var(--brown-500); }

/* ---------- Lists ---------- */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
button.li { width: 100%; text-align: left; transition: background .2s var(--ease); }
button.li:active { background: var(--surface-2); }
.li-main { flex: 1; min-width: 0; }
.li-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-sub { font-size: 12.5px; color: var(--brown-500); }
.li-end { text-align: right; font-variant-numeric: tabular-nums; }
.dot { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.dot.in { background: var(--good-soft); color: var(--good); }
.dot.out { background: var(--warn-soft); color: var(--warn); }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--brown-700); }

.banner {
  display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-md);
  background: var(--yellow-soft); border: 1px dashed var(--yellow-deep); font-size: 13.5px;
}

/* ---------- Segmented control with sliding thumb ---------- */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 13px; padding: 4px; }
.seg-thumb {
  position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 10px; background: var(--brown-800);
  transition: transform .38s var(--ease), width .38s var(--ease);
  box-shadow: 0 4px 10px -4px rgba(43,29,20,.5);
}
.seg button { position: relative; z-index: 1; min-height: 38px; font-weight: 700; font-size: 14px; color: var(--brown-700); border-radius: 10px; transition: color .3s var(--ease); }
.seg button.on { color: var(--yellow); }

/* ---------- Chips ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 38px; padding: 0 14px; border-radius: 99px; font-weight: 600; font-size: 14px;
  background: var(--surface); border: 1px solid var(--line); color: var(--brown-700);
  transition: background .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease), transform .15s var(--ease);
}
.chip:active { transform: scale(.95); }
.chip.on { background: var(--yellow); border-color: var(--yellow); color: var(--brown-900); }

/* ---------- Fields ---------- */
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--brown-500); }
.inp {
  display: flex; align-items: center; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.inp:focus-within { border-color: var(--yellow-deep); box-shadow: 0 0 0 4px rgba(245,184,0,.18); }
.inp input, .inp select, .inp textarea {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 11px 12px; font-size: 16px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.inp select { appearance: none; -webkit-appearance: none; cursor: pointer; }
.inp .unit { padding-right: 12px; font-size: 13px; font-weight: 700; color: var(--brown-300); }
.inp .caret { padding-right: 10px; color: var(--brown-300); display: grid; }

/* ---------- Result panel ---------- */
.result {
  border-radius: var(--r-lg); overflow: hidden; background: var(--brown-900); color: var(--on-dark);
  box-shadow: 0 14px 30px -16px rgba(43,29,20,.7);
}
.result-head { padding: 18px 18px 14px; background: radial-gradient(120% 140% at 100% 0%, rgba(245,184,0,.18), transparent 60%); }
.result-label { font-size: 11.5px; letter-spacing: 1.2px; font-weight: 700; text-transform: uppercase; color: var(--brown-300); }
.result-big { font: 800 46px/1 var(--display); color: var(--yellow); margin-top: 6px; font-variant-numeric: tabular-nums; }
.result-big small { font: 600 18px var(--body); color: var(--on-dark); margin-left: 6px; }
.result-note { font-size: 13px; color: var(--brown-300); margin-top: 6px; }
.result-rows { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid rgba(255,244,223,.1); }
.rr { padding: 12px 18px; border-bottom: 1px solid rgba(255,244,223,.08); }
.rr:nth-child(odd) { border-right: 1px solid rgba(255,244,223,.08); }
.rr-k { font-size: 12px; color: var(--brown-300); }
.rr-v { font: 700 21px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.rr-v small { font: 500 12.5px var(--body); color: var(--brown-300); margin-left: 3px; }
.result-foot { padding: 12px 18px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.flash { animation: flash .5s var(--ease); }
@keyframes flash { from { opacity: .45; transform: translateY(3px); } to { opacity: 1; transform: none; } }

.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.tbl th { text-align: left; font-size: 11.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--brown-500); font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.result .tbl th { color: var(--brown-300); border-color: rgba(255,244,223,.1); }
.result .tbl td { border-color: rgba(255,244,223,.08); }

/* ---------- Calculator tiles ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  text-align: left; padding: 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line);
  display: grid; gap: 14px; transition: transform .18s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
  box-shadow: var(--shadow);
}
.tile:active { transform: scale(.97); border-color: var(--yellow); }
.tile.feature { grid-column: 1 / -1; background: linear-gradient(140deg, var(--brown-700), var(--brown-900)); color: var(--on-dark); border-color: transparent; grid-template-columns: auto 1fr; align-items: center; }
.tile.feature .tile-sub { color: var(--brown-300); }
.tile.feature .tile-ic { background: var(--yellow); }
.tile-ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--yellow-soft); color: var(--brown-900); }
.tile-title { font: 700 19px/1.1 var(--display); letter-spacing: .2px; }
.tile-sub { font-size: 12.5px; color: var(--brown-500); margin-top: 3px; }

.back { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--brown-700); min-height: 40px; margin-left: -6px; padding-right: 8px; }

/* ---------- Attendance ---------- */
.datebar { display: flex; align-items: center; gap: 8px; }
.datebar .icon-btn { background: var(--surface); color: var(--brown-800); border: 1px solid var(--line); }
.datebar .when { flex: 1; text-align: center; }
.when-big { font: 700 22px/1.1 var(--display); }
.when-small { font-size: 12.5px; color: var(--brown-500); }
.worker { padding: 14px 16px; display: grid; gap: 12px; border-top: 1px solid var(--line); }
.worker:first-child { border-top: 0; }
.avatar { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; font: 700 17px var(--display); background: var(--surface-2); color: var(--brown-700); transition: background .3s var(--ease), color .3s var(--ease); }
.avatar.P { background: var(--good); color: #fff; }
.avatar.H { background: var(--warn); color: #fff; }
.avatar.A { background: var(--bad); color: #fff; }
.marks { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 6px; align-items: center; }
.mk {
  min-height: 40px; border-radius: 11px; font-weight: 700; font-size: 14px; background: var(--surface-2); color: var(--brown-700);
  transition: background .25s var(--ease), color .25s var(--ease), transform .15s var(--ease);
}
.mk:active { transform: scale(.94); }
.mk.on.P { background: var(--good); color: #fff; }
.mk.on.H { background: var(--warn); color: #fff; }
.mk.on.A { background: var(--bad); color: #fff; }
.ot { display: flex; align-items: center; background: var(--surface-2); border-radius: 11px; min-height: 40px; }
.ot button { width: 32px; height: 40px; font-weight: 800; font-size: 18px; color: var(--brown-700); }
.ot span { min-width: 40px; text-align: center; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.empty { padding: 28px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty-ic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--yellow-soft); color: var(--brown-700); }

/* ---------- Stock ---------- */
.mats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mat { text-align: left; padding: 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); transition: transform .18s var(--ease), border-color .25s var(--ease); }
.mat:active { transform: scale(.97); }
.mat.on { border-color: var(--yellow-deep); box-shadow: 0 0 0 3px rgba(245,184,0,.22); }
.mat-name { font-size: 13px; font-weight: 600; color: var(--brown-500); }
.mat-val { font: 700 26px/1.15 var(--display); font-variant-numeric: tabular-nums; }
.mat-val small { font: 600 13px var(--body); color: var(--brown-500); margin-left: 4px; }
.mat-bar { height: 5px; border-radius: 5px; background: var(--surface-2); margin-top: 10px; overflow: hidden; }
.mat-bar i { display: block; height: 100%; background: var(--yellow); border-radius: 5px; transition: width .6s var(--ease); }

/* ---------- Guide ---------- */
.acc { overflow: hidden; }
.acc-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 15px 16px; text-align: left; }
.acc-head .chev { margin-left: auto; transition: transform .35s var(--ease); color: var(--brown-500); }
.acc.open .chev { transform: rotate(180deg); }
.acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease); }
.acc.open .acc-body { grid-template-rows: 1fr; }
.acc-body > div { overflow: hidden; }
.acc-inner { padding: 0 16px 16px; display: grid; gap: 10px; }
.rule { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); align-items: baseline; }
.rule:first-child { border-top: 0; }
.rule-k { font-size: 14px; }
.rule-k small { display: block; color: var(--brown-500); font-size: 12.5px; }
.rule-v { font: 700 17px var(--display); text-align: right; color: var(--brown-800); white-space: nowrap; }
.note { font-size: 12.5px; color: var(--brown-500); padding: 10px 12px; background: var(--surface-2); border-radius: 10px; }

/* ---------- Tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 0 max(10px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(10px, env(safe-area-inset-left, 0px));
  background: var(--brown-900);
  box-shadow: 0 -10px 30px -12px rgba(43,29,20,.5);
}
.tabs { max-width: 560px; margin: 0 auto; height: var(--tabbar-h); display: grid; grid-template-columns: repeat(5, 1fr); position: relative; }
.tab-ind {
  position: absolute; top: 8px; height: 34px; width: 52px; border-radius: 12px; background: var(--yellow);
  left: 0; transition: transform .45s var(--ease);
}
.tab { position: relative; z-index: 1; display: grid; justify-items: center; align-content: center; gap: 5px; color: var(--brown-300); font-size: 11px; font-weight: 700; letter-spacing: .3px; transition: color .3s var(--ease); }
.tab svg { height: 34px; transition: color .3s var(--ease), transform .3s var(--ease); }
.tab.on { color: var(--on-dark); }
.tab.on svg { color: var(--brown-900); }
.tab:active svg { transform: scale(.88); }

/* ---------- Bottom sheet ---------- */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(30,20,13,.5); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.backdrop.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 560px; margin: 0 auto;
  background: var(--bg); border-radius: 26px 26px 0 0; max-height: 90vh; display: flex; flex-direction: column;
  transform: translateY(105%); transition: transform .45s var(--ease);
  box-shadow: 0 -20px 50px -20px rgba(30,20,13,.6);
}
.sheet.show { transform: none; }
.sheet-grab { width: 44px; height: 5px; border-radius: 5px; background: var(--brown-300); margin: 10px auto 0; opacity: .6; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px 6px 20px; }
.sheet-title { flex: 1; font: 800 24px/1.1 var(--display); }
.sheet-head .icon-btn { background: var(--surface-2); color: var(--brown-800); }
.sheet-body { overflow-y: auto; padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--brown-800); color: var(--on-dark); padding: 11px 16px; border-radius: 14px; font-weight: 600; font-size: 14px;
  display: flex; align-items: center; gap: 8px; box-shadow: 0 12px 28px -12px rgba(30,20,13,.7);
  transition: transform .4s var(--ease), opacity .3s var(--ease); max-width: calc(100% - 32px);
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast svg { color: var(--yellow); flex: none; }

@media (min-width: 600px) {
  .actions { grid-template-columns: repeat(4, 1fr); }
  .action { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 360px) {
  .fields, .stats, .mats { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
.sync { display: inline-flex; align-items: center; gap: 5px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brown-300); transition: background .3s var(--ease); }
.sync.ok::before { background: #7BC47F; }
.sync.busy::before { background: var(--yellow); }
.sync.err::before { background: #F08A73; }
</style>

/* ================= Formulas ================= */
const FT = 0.3048, IN = 0.0254, CFT = 35.3147, SQFT = 10.7639;
const BAG_M3 = 0.0347;       // one 50 kg cement bag
const DRY = 1.54;            // wet concrete -> dry material
const BAR_M = 12;            // standard sariya length
const DIAS = [6, 8, 10, 12, 16, 20, 25, 32];
const kgPerM = d => d * d / 162;

const GRADES = [
  { id: 'M7.5', r: [1, 4, 8], use: 'Levelling, PCC under footing' },

  { id: 'M25', r: [1, 1, 2], use: 'Heavy RCC, G+3 and above' }
];

function concreteMix(wet, ratio, wastePct) {
  const w = wet * (1 + wastePct / 100);
  const dry = w * DRY;
  const sum = ratio[0] + ratio[1] + ratio[2];
  const bags = dry * ratio[0] / sum / BAG_M3;
  return { wet: w, bags, sand: dry * ratio[1] / sum, agg: dry * ratio[2] / sum, water: bags * 50 * 0.5 };
}
function ringLen(b, d, cover, dia) {
  // closed ring with two 135° hooks (10d each), minus 3 × 90° bend deductions (2d each)
  return Math.max(0, 2 * (b - 2 * cover) + 2 * (d - 2 * cover) + 20 * dia / 1000 - 6 * dia / 1000);
}

/* Saving: always to this browser; when opened through the claude.ai link, also to the
   owner's private online store (data/users/<id>/…), split so no document grows too big:
   core (workers, materials), stock, advances, and one attendance document per month. */
let cloud = null, saveT, writing = false, dirty = false, syncState = 'local';
const written = {};
function splitDocs(d) {
  const byMonth = {};
  for (const [k, v] of Object.entries(d.attendance)) (byMonth[k.slice(0, 7)] = byMonth[k.slice(0, 7)] || {})[k] = v;
  const docs = {
    core: { sample: !!d.sample, siteName: d.siteName, workers: d.workers, materials: d.materials, areas: d.areas, months: Object.keys(byMonth).sort() },
    stock: { items: d.stock },
    advances: { items: d.advances }
  };
  for (const [m, days] of Object.entries(byMonth)) docs['att-' + m] = { days };
  return docs;
}
function setSync(s) {
  syncState = s;
  const el = $('#sync'); if (!el) return;
  el.className = 'sync ' + ({ ok: 'ok', busy: 'busy', err: 'err' }[s] || '');
  el.textContent = { local: 'Saved on this phone', ok: 'Saved online', busy: 'Saving…', err: 'Not saved online · check internet' }[s];
}
function save() { clearTimeout(saveT); if (cloud) setSync('busy'); saveT = setTimeout(flush, 400); }
async function flush() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (!cloud) return;
  if (writing) { dirty = true; return; }
  writing = true;
  try {
    const docs = splitDocs(S);
    for (const [name, body] of Object.entries(docs)) {
      const j = JSON.stringify(body);
      if (written[name] === j) continue;
      await cloud.doc(name).set(body);
      written[name] = j;
    }
    for (const name of Object.keys(written)) if (!(name in docs)) { await cloud.doc(name).delete(); delete written[name]; }
    setSync('ok');
  } catch (e) {
    setSync('err');
    if (e && e.code === 'quota_exceeded') toast('Online storage is full. Download a backup and delete old entries.');
  }
  writing = false;
  if (dirty) { dirty = false; flush(); }
}
async function connectCloud() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = db && user ? await user.id() : null;
    if (!id) return;
    const col = db.collection('data/users/' + id);
    const core = await col.doc('core').get();
    if (core.exists) {
      const c = core.data();
      const [stock, adv, ...months] = await Promise.all([col.doc('stock').get(), col.doc('advances').get(), ...(c.months || []).map(m => col.doc('att-' + m).get())]);
      const attendance = {};
      months.forEach((s, i) => { if (s.exists) { Object.assign(attendance, s.data().days || {}); written['att-' + c.months[i]] = JSON.stringify(s.data()); } });
      written.core = JSON.stringify(c);
      if (stock.exists) written.stock = JSON.stringify(stock.data());
      if (adv.exists) written.advances = JSON.stringify(adv.data());
      S = JSON.parse(JSON.stringify({
        ...emptyData(), sample: !!c.sample, siteName: c.siteName, workers: c.workers || [], materials: c.materials || emptyData().materials, areas: c.areas || [],
        attendance, stock: stock.exists ? stock.data().items || [] : [], advances: adv.exists ? adv.data().items || [] : []
      }));
      cloud = col;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      setSync('ok');
      render();
    } else {
      cloud = col;  // first visit: upload what this browser has
      save();
    }
  } catch (e) { setSync('err'); }
}

const dayFactor = m => !m ? 0 : m.s === 'P' ? 1 : m.s === 'H' ? .5 : 0;
const dayPay = (w, m) => !m ? 0 : w.wage * dayFactor(m) + (m.ot || 0) * w.wage / 8;
const balance = id => S.stock.reduce((b, e) => e.mat === id ? b + (e.kind === 'in' ? e.qty : -e.qty) : b, 0);
const received = id => S.stock.reduce((b, e) => e.mat === id && e.kind === 'in' ? b + e.qty : b, 0);
const matById = id => S.materials.find(m => m.id === id) || { id, name: id, unit: '' };
const activeWorkers = () => S.workers.filter(w => w.active !== false);

function monthOf(w, m) {
  let days = 0, ot = 0, earned = 0;
  for (const [k, marks] of Object.entries(S.attendance)) {
    if (!k.startsWith(m) || !marks[w.id]) continue;
    days += dayFactor(marks[w.id]); ot += marks[w.id].ot || 0; earned += dayPay(w, marks[w.id]);
  }
  const adv = S.advances.filter(a => a.workerId === w.id && a.date.startsWith(m)).reduce((s, a) => s + a.amount, 0);
  return { days, ot, earned, adv, bal: earned - adv };
}
function dayWages(k) {
  const marks = S.attendance[k] || {};
  return S.workers.reduce((s, w) => s + dayPay(w, marks[w.id]), 0);
}
function monthWages(m) { return S.workers.reduce((s, w) => s + monthOf(w, m).earned, 0); }
function monthMaterialSpend(m) { return S.stock.filter(e => e.kind === 'in' && e.date.startsWith(m)).reduce((s, e) => s + e.qty * (e.rate || 0), 0); }

const QUICK_KG = { slab: [90, 'Slab · 80–100 kg/m³'], beam: [140, 'Beam · 120–160 kg/m³'], column: [180, 'Column · 160–200 kg/m³'], footing: [80, 'Footing · 70–90 kg/m³'] };

function unitOf(t, sys) {
  return { len: sys === 'imp' ? 'ft' : 'm', sec: sys === 'imp' ? 'in' : 'mm', mm: 'mm', dia: 'mm', pct: '%', x: '× dia', rate: '₹/kg', cnt: 'nos', vol: sys === 'imp' ? 'cft' : 'm³' }[t] || '';
}
function convertDefault(t, v, sys) {
  if (sys === 'imp' || v === '') return v;
  if (t === 'len') return +(v * FT).toFixed(2);
  if (t === 'sec') return Math.round(v * 25.4 / 5) * 5;
  if (t === 'vol') return +(v / CFT).toFixed(2);
  return v;
}
function freshCalc(id, el, sys) {
  const els = EL[id];
  el = el || Object.keys(els)[0];
  sys = sys || 'imp';
  const cs = { el, sys, v: {} };
  els[el].fields.forEach(([k, t, , def]) => cs.v[k] = convertDefault(t, def, sys));
  if (id === 'concrete') { cs.grade = els[el].grade; cs.waste = 5; }
  if (id === 'brick') { cs.thick = '9'; cs.mortar = 6; }
  if (id === 'plaster') { cs.thick = 12; cs.mix = 4; cs.sides = 2; }
  return cs;
}
const mOf = (t, v, sys) => {
  v = n(v);
  if (t === 'len') return sys === 'imp' ? v * FT : v;
  if (t === 'sec') return sys === 'imp' ? v * IN : v / 1000;
  if (t === 'mm') return v / 1000;
  if (t === 'vol') return sys === 'imp' ? v / CFT : v;
  return v;
};

function calcResult(id, cs) {
  const v = k => cs.v[k];
  const f = Object.fromEntries(EL[id][cs.el].fields.map(([k, t]) => [k, t === 'dia' ? n(v(k)) : t === 'sel' ? v(k) : (t === 'len' || t === 'sec' || t === 'mm' || t === 'vol') ? mOf(t, v(k), cs.sys) : n(v(k))]));
  const imp = cs.sys === 'imp';
  const L = m => imp ? fmt(m / FT, 1) + ' ft' : fmt(m, 2) + ' m';

  if (id === 'concrete') {
    const c = f.count || 1;
    const vol = { column: c * f.h * f.b * f.d, beam: c * f.l * f.b * f.d, slab: f.l * f.w * f.t, footing: c * f.l * f.w * f.t, road: f.l * f.w * f.t }[cs.el];
    const g = GRADES.find(x => x.id === cs.grade);
    const r = concreteMix(vol, g.r, cs.waste);
    return {
      label: 'Cement needed', big: Math.ceil(r.bags), unit: 'bags',
      note: `${fmt(vol, 2)} m³ (${fmt(vol * CFT, 0)} cft) of ${cs.grade} concrete, mix ${g.r.join(':')}`,
      rows: [['Sand', fmt(r.sand * CFT, 0), 'cft'], ['Gitti', fmt(r.agg * CFT, 0), 'cft'], ['Sand (brass)', fmt(r.sand * CFT / 100, 2), 'brass'], ['Water', fmt(r.water, 0), 'litre']],
      use: { mat: 'cement', qty: Math.ceil(r.bags), note: `${EL.concrete[cs.el].label} ${cs.grade}` }
    };
  }
  if (id === 'steel') {
    const lines = [];
    if (cs.el === 'column') {
      const c = f.count || 1;
      lines.push(['Main bars', f.md, c * f.mn * (f.h + f.lap * f.md / 1000)]);
      const rings = Math.floor(f.h / (f.rs || 1)) + 1;
      lines.push([`Rings · ${c * rings} pcs of ${L(ringLen(f.b, f.d, f.cover, f.rd))}`, f.rd, c * rings * ringLen(f.b, f.d, f.cover, f.rd)]);
    } else if (cs.el === 'beam') {
      const c = f.count || 1;
      lines.push(['Top bars', f.td, c * f.tn * (f.l + 2 * f.anc * f.td / 1000)]);
      lines.push(['Bottom bars', f.bd, c * f.bn * (f.l + 2 * f.anc * f.bd / 1000)]);
      const rings = Math.floor(f.l / (f.rs || 1)) + 1;
      lines.push([`Rings · ${c * rings} pcs of ${L(ringLen(f.b, f.d, f.cover, f.rd))}`, f.rd, c * rings * ringLen(f.b, f.d, f.cover, f.rd)]);
    } else if (cs.el === 'slab') {
      const k = 1 + f.extra / 100;
      const mainCount = Math.floor(Math.max(0, f.ll - 2 * f.cover) / (f.ms || 1)) + 1;
      const distCount = Math.floor(Math.max(0, f.ls - 2 * f.cover) / (f.ds || 1)) + 1;
      lines.push([`Main bars · ${mainCount} pcs`, f.md, mainCount * Math.max(0, f.ls - 2 * f.cover) * k]);
      lines.push([`Distribution · ${distCount} pcs`, f.dd, distCount * Math.max(0, f.ll - 2 * f.cover) * k]);
    }
    if (cs.el === 'quick') {
      const kg = f.vol * QUICK_KG[f.type][0];
      return {
        label: 'Approx. sariya', big: fmt(kg, 0), unit: 'kg',
        note: `${fmt(f.vol, 2)} m³ × ${QUICK_KG[f.type][0]} kg/m³ thumb rule (${fmt(kg / 1000, 2)} tonne)`,
        rows: [['Tonnes', fmt(kg / 1000, 2), 't'], ['Cost', f.rate ? money(kg * f.rate) : '—', '']],
        use: { mat: 'sariya', qty: Math.round(kg), note: 'Quick estimate' }
      };
    }
    const byDia = {};
    lines.forEach(([, d, len]) => { byDia[d] = (byDia[d] || 0) + len; });
    const total = Object.entries(byDia).reduce((s, [d, len]) => s + kgPerM(+d) * len, 0);
    const table = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th class="r">Size</th><th class="r">Length</th><th class="r">kg</th></tr></thead><tbody>
      ${lines.map(([l, d, len]) => `<tr><td>${l}</td><td class="r">${d} mm</td><td class="r">${fmt(len, 1)} m</td><td class="r">${fmt(kgPerM(d) * len, 1)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Order list</th><th class="r">kg</th><th class="r">12 m bars</th></tr></thead><tbody>
      ${Object.entries(byDia).sort((a, b) => a[0] - b[0]).map(([d, len]) => `<tr><td>${d} mm · ${fmt(kgPerM(+d), 3)} kg/m</td><td class="r">${fmt(kgPerM(+d) * len, 1)}</td><td class="r">${Math.ceil(len / BAR_M)}</td></tr>`).join('')}
      </tbody></table></div>`;
    return {
      label: 'Total sariya', big: fmt(total, 0), unit: 'kg',
      note: `${fmt(total / 1000, 2)} tonne${f.rate ? ` · approx. ${money(total * f.rate)}` : ''}`,
      table, use: { mat: 'sariya', qty: Math.round(total), note: EL.steel[cs.el].label }
    };
  }
  if (id === 'area') {
    const m2 = { rect: f.l * f.w, tri: f.b * f.h / 2, trap: (f.a + f.c) / 2 * f.h, circle: Math.PI * f.d * f.d / 4 }[cs.el];
    const listTotal = S.areas.reduce((s, a) => s + a.m2, 0);
    return {
      label: 'Area', big: imp ? fmt(m2 * SQFT, 1) : fmt(m2, 2), unit: imp ? 'sq ft' : 'sq m',
      rows: [[imp ? 'Sq m' : 'Sq ft', imp ? fmt(m2, 2) : fmt(m2 * SQFT, 1), ''], ['Gaj / sq yd', fmt(m2 * 1.19599, 1), ''], ['Marla', fmt(m2 * SQFT / 272.25, 2), '272.25 sq ft'], ['Acre', fmt(m2 / 4046.86, 4), '']],
      area: m2,
      after: S.areas.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Saved</th><th class="r">Sq ft</th><th class="r">Sq m</th><th></th></tr></thead><tbody>
        ${S.areas.map(a => `<tr><td>${esc(a.name)}</td><td class="r">${fmt(a.m2 * SQFT, 1)}</td><td class="r">${fmt(a.m2, 2)}</td><td class="r"><button class="btn-ghost" data-a="delArea" data-id="${a.id}" aria-label="Remove ${esc(a.name)}">${ic('x', 16)}</button></td></tr>`).join('')}
        <tr><td><b>Total</b></td><td class="r"><b>${fmt(listTotal * SQFT, 1)}</b></td><td class="r"><b>${fmt(listTotal, 2)}</b></td><td></td></tr></tbody></table></div>` : ''
    };
  }
  if (id === 'brick') {
    const t = cs.thick === '9' ? 0.23 : 0.115;
    const open = n(cs.v.doors) * 21 / SQFT + n(cs.v.wins) * 16 / SQFT;
    const areaM2 = Math.max(0, f.l * f.h - open);
    const vol = areaM2 * t;
    const bricks = vol * 500 * 1.05;
    const wetMortar = vol * (1 - 500 * 0.19 * 0.09 * 0.09);
    const dry = wetMortar * 1.33 * 1.05;
    const bags = dry / (1 + cs.mortar) / BAG_M3;
    return {
      label: 'Bricks needed', big: fmt(Math.ceil(bricks / 10) * 10, 0), unit: 'bricks',
      note: `${fmt(areaM2 * SQFT, 0)} sq ft of ${cs.thick}" wall after openings · ${fmt(vol, 2)} m³ · 5% breakage added`,
      rows: [['Cement', fmt(Math.ceil(bags), 0), 'bags'], ['Sand', fmt(dry * cs.mortar / (1 + cs.mortar) * CFT, 0), 'cft'], ['Wall area', fmt(areaM2 * SQFT, 0), 'sq ft'], ['Mortar', '1:' + cs.mortar, '']],
      use: { mat: 'bricks', qty: Math.ceil(bricks), note: `${cs.thick}" wall` }
    };
  }
  if (id === 'plaster') {
    const area = f.l * f.h * cs.sides;
    const wet = area * cs.thick / 1000;
    const dry = wet * 1.33 * 1.2;
    const bags = dry / (1 + cs.mix) / BAG_M3;
    return {
      label: 'Cement needed', big: Math.ceil(bags), unit: 'bags',
      note: `${fmt(area * SQFT, 0)} sq ft · ${cs.thick} mm · 1:${cs.mix} · 20% added for uneven surface`,
      rows: [['Sand', fmt(dry * cs.mix / (1 + cs.mix) * CFT, 0), 'cft'], ['Area', fmt(area * SQFT, 0), 'sq ft'], ['Mortar (wet)', fmt(wet, 2), 'm³'], ['Sand (brass)', fmt(dry * cs.mix / (1 + cs.mix) * CFT / 100, 2), 'brass']],
      use: { mat: 'cement', qty: Math.ceil(bags), note: 'Plaster' }
    };
  }
}

  <div class="note">Thumb rules used on most Indian house sites (IS 456 / IS 13920). Use them to check work and estimate. The final design must come from a structural engineer.</div>
  <div class="stack">${GUIDE.map(g => `
    <div class="card acc ${ui.guideOpen[g.id] ? 'open' : ''}" data-acc="${g.id}">
      <button class="acc-head" data-a="acc" data-id="${g.id}" aria-expanded="${!!ui.guideOpen[g.id]}">
        <span class="action-ic">${ic(g.icon, 20)}</span><span class="tile-title">${g.title}</span><span class="chev">${ic('down', 20)}</span>
      </button>
      <div class="acc-body"><div><div class="acc-inner">
        ${g.table ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Size</th><th class="r">kg / m</th><th class="r">kg / 12 m bar</th><th class="r">Bars / tonne</th></tr></thead><tbody>
          ${DIAS.map(d => `<tr><td><b>${d} mm</b></td><td class="r">${kgPerM(d).toFixed(3)}</td><td class="r">${(kgPerM(d) * 12).toFixed(2)}</td><td class="r">${Math.round(1000 / (kgPerM(d) * 12))}</td></tr>`).join('')}
          </tbody></table></div><div class="note">Weight per metre = D × D ÷ 162, where D is bar size in mm.</div>`
        : `<div>${g.rules.map(([k, s, v]) => `<div class="rule"><div class="rule-k">${k}${s ? `<small>${s}</small>` : ''}</div><div class="rule-v">${v}</div></div>`).join('')}</div>`}
      </div></div></div>
    </div>`).join('')}</div>`;

/* ================= Sheets ================= */
let sheetSubmit = null;
function openSheet(title, body, onSubmit) {
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = body;
  sheetSubmit = onSubmit;
  $('#backdrop').classList.add('show');
  $('#sheet').classList.add('show');
  layoutSegs($('#sheetBody'));
  const first = $('#sheetBody').querySelector('input:not([type=hidden])');
  if (first && matchMedia('(pointer:fine)').matches) setTimeout(() => first.focus(), 350);
}
function closeSheet() {
  $('#backdrop').classList.remove('show');
  $('#sheet').classList.remove('show');
  sheetSubmit = null;
}
const fld = (id, label, value = '', attrs = '', unit = '', full = true) =>
  `<div class="field ${full ? 'full' : ''}"><label for="${id}">${label}</label><div class="inp"><input id="${id}" name="${id}" value="${esc(value)}" ${attrs}>${unit ? `<span class="unit">${unit}</span>` : ''}</div></div>`;
const sel = (id, label, opts, value, full = true) =>
  `<div class="field ${full ? 'full' : ''}"><label for="${id}">${label}</label><div class="inp"><select id="${id}" name="${id}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${v === value ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select><span class="caret">${ic('down', 16)}</span></div></div>`;

function workerSheet(id) {
  const w = S.workers.find(x => x.id === id);
  const m = ui.month;
  let extra = '';
  if (w) {
    const r = monthOf(w, m);
    const adv = S.advances.filter(a => a.workerId === w.id).sort((a, b) => b.date.localeCompare(a.date));
    extra = `
    <div class="stats">
      <div class="stat hero"><div class="stat-label">To pay · ${pkey(m + '-01').toLocaleDateString('en-IN', { month: 'short' })}</div><div class="stat-val">${money(r.bal)}</div><div class="stat-note">${fmt(r.days)} days${r.ot ? ` · ${r.ot}h OT` : ''}</div></div>
      <div class="stat"><div class="stat-label">Earned</div><div class="stat-val">${money(r.earned)}</div><div class="stat-note">Advance ${money(r.adv)}</div></div>
    </div>
    <form class="card pad stack" data-form="advance">
      <h2 class="sec">Give advance</h2>
      <div class="fields">${fld('advAmt', 'Amount', '', 'inputmode="numeric" required placeholder="500"', '₹', false)}${fld('advDate', 'Date', today(), 'type="date" required', '', false)}${fld('advNote', 'Note', '', 'placeholder="Cash, UPI…"')}</div>
      <button class="btn btn-dark" type="submit">${ic('wallet', 18)} Save advance</button>
    </form>
    ${adv.length ? `<div class="card list">${adv.map(a => `<div class="li"><div class="li-main"><div class="li-title">${money(a.amount)}</div><div class="li-sub">${pretty(a.date)}${a.note ? ' · ' + esc(a.note) : ''}</div></div><button class="icon-btn" style="background:var(--surface-2);color:var(--brown-700)" data-a="delAdv" data-id="${a.id}" aria-label="Delete advance">${ic('trash', 18)}</button></div>`).join('')}</div>` : ''}
    <h2 class="sec">Details</h2>`;
  }
  openSheet(w ? w.name : 'Add worker', `${extra}
    <form class="stack" data-form="worker">
      <div class="fields">
        ${fld('wName', 'Name', w ? w.name : '', 'required autocomplete="off" placeholder="Full name"')}
        ${sel('wRole', 'Work', ROLES.map(r => [r, r]), w ? w.role : 'Labour', false)}
        ${fld('wWage', 'Daily wage', w ? w.wage : '', 'inputmode="numeric" required placeholder="600"', '₹', false)}
        ${fld('wPhone', 'Phone (optional)', w ? w.phone : '', 'inputmode="tel" autocomplete="off"')}
      </div>
      <button class="btn btn-primary btn-block" type="submit">${ic('check', 18, 2.5)} ${w ? 'Save changes' : 'Add worker'}</button>
      ${w ? `<div class="row">
        <button class="btn btn-soft grow" type="button" data-a="toggleActive" data-id="${w.id}">${w.active === false ? 'Back on site' : 'Mark as left site'}</button>
        <button class="btn btn-danger" type="button" data-a="delWorker" data-id="${w.id}">${ic('trash', 18)}</button></div>
        <div id="confirmBox"></div>` : ''}
    </form>`, (form, kind) => {
    const fd = new FormData(form);
    if (kind === 'advance') {
      const amt = n(fd.get('advAmt'));
      if (!amt) return toast('Enter the advance amount');
      S.advances.push({ id: uid(), workerId: w.id, date: fd.get('advDate') || today(), amount: amt, note: String(fd.get('advNote') || '').trim() });
      save(); render(); workerSheet(w.id); toast(`Advance of ${money(amt)} saved`);
      return;
    }
    const name = String(fd.get('wName') || '').trim(), wage = n(fd.get('wWage'));
    if (!name || !wage) return toast('Name and daily wage are needed');
    if (w) Object.assign(w, { name, role: fd.get('wRole'), wage, phone: String(fd.get('wPhone') || '').trim() });
    else S.workers.push({ id: uid(), name, role: fd.get('wRole'), wage, phone: String(fd.get('wPhone') || '').trim(), active: true });
    save(); closeSheet(); render(); toast(w ? 'Worker updated' : `${name} added`);
  });
}

function stockSheet(kind, prefill = {}, editId) {
  const e = editId ? S.stock.find(x => x.id === editId) : null;
  if (e) { kind = e.kind; prefill = e; }
  const mat = prefill.mat || (ui.stockMat !== 'all' ? ui.stockMat : 'cement');
  openSheet(e ? 'Edit entry' : kind === 'in' ? 'Material received' : 'Material used', `
    <form class="stack" data-form="stock">
      <input type="hidden" name="kind" value="${kind}">
      <div class="fields">
        ${sel('sMat', 'Material', S.materials.map(m => [m.id, `${m.name} (${m.unit})`]), mat)}
        ${fld('sQty', 'Quantity', prefill.qty || '', 'inputmode="decimal" required placeholder="0"', '', false)}
        ${fld('sDate', 'Date', prefill.date || today(), 'type="date" required', '', false)}
        ${kind === 'in' ? fld('sRate', 'Rate per unit', prefill.rate || '', 'inputmode="decimal" placeholder="e.g. 390"', '₹', false) : ''}
        ${fld('sNote', kind === 'in' ? 'Supplier / bill no.' : 'Used for', prefill.note || '', 'autocomplete="off"', '', kind !== 'in')}
      </div>
      <div class="muted small" id="stockHint"></div>
      <button class="btn btn-primary btn-block" type="submit">${ic('check', 18, 2.5)} ${e ? 'Save changes' : 'Save entry'}</button>
      ${e ? `<button class="btn btn-danger btn-block" type="button" data-a="delStock" data-id="${e.id}">${ic('trash', 18)} Delete entry</button>` : ''}
    </form>`, form => {
    const fd = new FormData(form);
    const qty = n(fd.get('sQty'));
    if (!qty) return toast('Enter a quantity');
    const rec = { mat: fd.get('sMat'), kind, qty, date: fd.get('sDate') || today(), rate: kind === 'in' ? n(fd.get('sRate')) : 0, note: String(fd.get('sNote') || '').trim() };
    if (e) Object.assign(e, rec); else S.stock.push({ id: uid(), ...rec });
    save(); closeSheet(); render();
    const m = matById(rec.mat);
    toast(`${m.name}: ${fmt(balance(m.id))} ${m.unit} left`);
  });
  const hint = () => { const m = matById($('#sMat').value); $('#stockHint').textContent = `In stock now: ${fmt(balance(m.id))} ${m.unit}`; };
  $('#sMat').addEventListener('change', hint); hint();
}

function settingsSheet() {
  openSheet('Site settings', `
    <form class="stack" data-form="settings">
      <div class="fields">${fld('siteName', 'Site name', S.siteName, 'required autocomplete="off"')}</div>
      <button class="btn btn-primary btn-block" type="submit">Save name</button>
    </form>
    <div class="card pad stack">
      <h2 class="sec">Backup</h2>
      <div class="muted small">${cloud ? 'Your data is saved online in your private account, so it opens on any phone where you sign in.' : 'Your data is saved in this browser on this phone.'} Download a backup file now and then to keep a copy.</div>
      <div class="row wrap"><button class="btn btn-dark grow" data-a="export">Download backup</button>
      <label class="btn btn-soft grow" for="importFile">Restore backup</label><input type="file" id="importFile" accept="application/json,.json" hidden></div>
    </div>
    <div class="card pad stack">
      <h2 class="sec">Start over</h2>
      <div class="muted small">Deletes all workers, hajri, advances and stock from this phone.</div>
      <button class="btn btn-danger" data-a="wipe">Delete all data</button><div id="confirmBox"></div>
    </div>`, form => {
    S.siteName = String(new FormData(form).get('siteName') || '').trim() || 'My Site';
    save(); closeSheet(); render(); toast('Site name saved');
  });
  $('#importFile').addEventListener('change', ev => {
    const file = ev.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d.workers || !d.stock) throw 0;
        S = { ...emptyData(), ...d }; save(); closeSheet(); render('in'); toast('Backup restored');
      } catch (e) { toast('That file is not a SiteBook backup'); }
    };
    rd.readAsText(file);
  });
}

function confirmIn(text, yesLabel, onYes) {
  const box = $('#confirmBox'); if (!box) return;
  box.innerHTML = `<div class="banner" style="background:var(--bad-soft);border-color:var(--bad)"><div class="grow">${text}</div><button class="btn btn-sm" style="background:var(--bad);color:#fff" id="yesBtn">${yesLabel}</button></div>`;
  $('#yesBtn').onclick = onYes;
}

/* ================= Toast ================= */
let toastT;
function toast(msg) {
  const t = $('#toast');
  t.innerHTML = ic('check', 18, 2.5) + esc(msg);
  t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ================= Actions ================= */
const A = {
  tab: d => { if (ui.tab === d.id && !ui.calc) return; const order = TABS.map(t => t.id); const back = order.indexOf(d.id) < order.indexOf(ui.tab); ui.tab = d.id; if (d.id === 'calc') ui.calc = null; render(back ? 'back' : 'in'); scrollTo({ top: 0, behavior: 'smooth' }); },
  go: d => A.tab({ id: d.tab }),
  settings: () => settingsSheet(),
  closeSheet: () => closeSheet(),
  clearSample: () => { S = emptyData(); save(); render('in'); toast('Sample cleared. Add your site details.'); settingsSheet(); },

  attView: d => { ui.attView = d.v; render('in'); },
  attDay: d => { const nk = shift(ui.attDate, +d.d); if (nk > today()) return; ui.attDate = nk; render(+d.d < 0 ? 'back' : 'in'); },
  attToday: () => { ui.attDate = today(); render('in'); },
  month: d => { ui.month = shiftMonth(ui.month, +d.d); render(+d.d < 0 ? 'back' : 'in'); },
  mark: d => {
    const day = S.attendance[ui.attDate] = S.attendance[ui.attDate] || {};
    const cur = day[d.w];
    if (cur && cur.s === d.s) delete day[d.w]; else day[d.w] = { s: d.s, ot: cur ? cur.ot || 0 : 0 };
    if (navigator.vibrate) navigator.vibrate(8);
    save(); render();
  },
  ot: d => {
    const day = S.attendance[ui.attDate] = S.attendance[ui.attDate] || {};
    const cur = day[d.w] || { s: 'P', ot: 0 };
    cur.ot = Math.max(0, Math.min(12, (cur.ot || 0) + +d.d));
    day[d.w] = cur; save(); render();
  },
  allPresent: () => {
    const day = S.attendance[ui.attDate] = S.attendance[ui.attDate] || {};
    let c = 0; activeWorkers().forEach(w => { if (!day[w.id]) { day[w.id] = { s: 'P', ot: 0 }; c++; } });
    save(); render(); toast(`${c} marked present`);
  },
  workerSheet: d => workerSheet(d.id),
  toggleActive: d => { const w = S.workers.find(x => x.id === d.id); w.active = w.active === false; save(); closeSheet(); render(); toast(w.active ? `${w.name} is back on site` : `${w.name} marked as left`); },
  delWorker: d => confirmIn('Delete this worker and all their hajri?', 'Delete', () => {
    S.workers = S.workers.filter(w => w.id !== d.id);
    S.advances = S.advances.filter(a => a.workerId !== d.id);
    Object.values(S.attendance).forEach(day => delete day[d.id]);
    save(); closeSheet(); render(); toast('Worker deleted');
  }),
  delAdv: d => { const a = S.advances.find(x => x.id === d.id); S.advances = S.advances.filter(x => x.id !== d.id); save(); render(); workerSheet(a.workerId); toast('Advance deleted'); },

  pickMat: d => { if (ui.tab !== 'stock') { ui.tab = 'stock'; ui.stockMat = d.id; render('in'); return; } ui.stockMat = ui.stockMat === d.id ? 'all' : d.id; render(); },
  stockSheet: d => stockSheet(d.kind),
  stockEdit: d => stockSheet(null, {}, d.id),
  delStock: d => { S.stock = S.stock.filter(e => e.id !== d.id); save(); closeSheet(); render(); toast('Entry deleted'); },
  matSheet: () => openSheet('New material', `<form class="stack" data-form="mat"><div class="fields">${fld('mName', 'Name', '', 'required autocomplete="off" placeholder="e.g. Tiles"', '', false)}${fld('mUnit', 'Unit', '', 'required autocomplete="off" placeholder="box, sq ft, nos"', '', false)}</div><button class="btn btn-primary btn-block" type="submit">Add material</button></form>`, form => {
    const fd = new FormData(form), name = String(fd.get('mName')).trim(), unit = String(fd.get('mUnit')).trim();
    if (!name || !unit) return toast('Enter name and unit');
    S.materials.push({ id: uid(), name, unit }); save(); closeSheet(); render(); toast(`${name} added`);
  }),

  openCalc: d => { ui.tab = 'calc'; ui.calc = d.id; ui.cs[d.id] = ui.cs[d.id] || freshCalc(d.id); render('in'); scrollTo({ top: 0, behavior: 'smooth' }); },
  closeCalc: () => { ui.calc = null; render('back'); },
  cel: d => { const cs = ui.cs[ui.calc]; ui.cs[ui.calc] = { ...freshCalc(ui.calc, d.v, cs.sys), ...(ui.calc === 'concrete' ? {} : { thick: cs.thick, mortar: cs.mortar, mix: cs.mix, sides: cs.sides }) }; if (ui.calc === 'concrete') ui.cs.concrete.waste = cs.waste; render(); },
  csys: d => {
    const id = ui.calc, cs = ui.cs[id];
    if (cs.sys === d.v) return;
    EL[id][cs.el].fields.forEach(([k, t]) => {
      const v = n(cs.v[k]); if (!v) return;
      if (t === 'len') cs.v[k] = d.v === 'met' ? +(v * FT).toFixed(2) : +(v / FT).toFixed(1);
      if (t === 'sec') cs.v[k] = d.v === 'met' ? Math.round(v * 25.4 / 5) * 5 : +(v / 25.4).toFixed(1);
      if (t === 'vol') cs.v[k] = d.v === 'met' ? +(v / CFT).toFixed(2) : +(v * CFT).toFixed(0);
    });
    cs.sys = d.v; render();
  },
  cset: d => { const cs = ui.cs[ui.calc]; cs[d.k] = isNaN(+d.v) || d.k === 'thick' && ui.calc === 'brick' ? d.v : +d.v; if (d.k === 'grade') cs.grade = d.v; render(); },
  useFromCalc: () => { const u = ui.lastResult && ui.lastResult.use; if (u) stockSheet('out', { mat: u.mat, qty: u.qty, note: u.note }); },
  saveArea: () => openSheet('Save area', `<form class="stack" data-form="area"><div class="fields">${fld('aName', 'Name', `Room ${S.areas.length + 1}`, 'required autocomplete="off"')}</div><button class="btn btn-primary btn-block" type="submit">Save</button></form>`, form => {
    S.areas.push({ id: uid(), name: String(new FormData(form).get('aName')).trim() || 'Area', m2: ui.lastResult.area }); save(); closeSheet(); updateCalc(); toast('Added to list');
  }),
  delArea: d => { S.areas = S.areas.filter(a => a.id !== d.id); save(); updateCalc(); },
  copyCalc: () => {
    const r = ui.lastResult; if (!r) return;
    const txt = `${CALCS[ui.calc].title}\n${r.label}: ${r.big} ${r.unit}\n${r.note || ''}\n${(r.rows || []).map(([k, v, u]) => `${k}: ${v} ${u}`).join('\n')}`.trim();
    navigator.clipboard && navigator.clipboard.writeText(txt).then(() => toast('Copied. Paste it in WhatsApp.'), () => toast('Copy is blocked in this browser'));
  },

  acc: d => { ui.guideOpen[d.id] = !ui.guideOpen[d.id]; const el = document.querySelector(`[data-acc="${d.id}"]`); el.classList.toggle('open'); el.querySelector('.acc-head').setAttribute('aria-expanded', !!ui.guideOpen[d.id]); },

  export: async () => {
    const data = JSON.stringify(S, null, 2), filename = `sitebook-backup-${today()}.json`;
    const dl = window.claude && window.claude.use ? await claude.use('downloads').catch(() => null) : null;
    if (dl) {
      try { await dl.save({ filename, data }); toast('Backup saved'); }
      catch (e) { toast(e && e.code === 'declined' ? 'Backup not saved' : 'Backup is not available here'); }
      return;
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Backup downloaded');
  },
  wipe: () => confirmIn('This cannot be undone.', 'Delete all', () => { S = emptyData(); save(); closeSheet(); render('in'); toast('All data deleted'); })
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (sheetSubmit) sheetSubmit(e.target, e.target.dataset.form);
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.f;
  if (!k || !ui.calc) return;
  ui.cs[ui.calc].v[k] = e.target.value;
  clearTimeout(window._ct); window._ct = setTimeout(() => updateCalc(true), 120);
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.f;
  if (k && ui.calc && e.target.tagName === 'SELECT') { ui.cs[ui.calc].v[k] = e.target.value; updateCalc(true); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
addEventListener('resize', () => { renderTabs(); layoutSegs(document); });

document.querySelector('[data-a="settings"]').innerHTML = ic('sliders', 20);
document.querySelector('.sheet-head [data-a="closeSheet"]').innerHTML = ic('x', 20);
render('in');
connectCloud();
</script>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
